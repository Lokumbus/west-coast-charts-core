name: Security policy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-security-policy.mjs
      - name: Verify exported Core payload integrity
        run: node scripts/verify-core.mjs
      - name: Verify canonical reviewed release archive
        run: node scripts/verify-release-archive.mjs
